<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Segoe UI, -apple-system, sans-serif">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- TeachReplay Core -->
  <rect x="230" y="20" width="300" height="46" rx="10" fill="url(#core)"/>
  <text x="380" y="49" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">TeachReplay Core</text>

  <!-- pipeline -->
  <g font-size="12.5" fill="#1f2937" text-anchor="middle">
    <rect x="60" y="92" width="100" height="30" rx="8" fill="#dbeafe"/>
    <text x="110" y="111">Record</text>
    <rect x="190" y="92" width="100" height="30" rx="8" fill="#dbeafe"/>
    <text x="240" y="111">Compile</text>
    <rect x="320" y="92" width="100" height="30" rx="8" fill="#dbeafe"/>
    <text x="370" y="111">Replay</text>
    <rect x="450" y="92" width="100" height="30" rx="8" fill="#dbeafe"/>
    <text x="500" y="111">Verify</text>
    <rect x="580" y="92" width="120" height="30" rx="8" fill="#fef3c7"/>
    <text x="640" y="111">GUI + CLI skills</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.6" fill="none">
    <line x1="160" y1="107" x2="188" y2="107"/>
    <line x1="290" y1="107" x2="318" y2="107"/>
    <line x1="420" y1="107" x2="448" y2="107"/>
    <line x1="550" y1="107" x2="578" y2="107"/>
    <line x1="380" y1="66" x2="380" y2="90"/>
  </g>

  <!-- adapters -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="90" y="172" width="200" height="34" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="190" y="193" fill="#3730a3">OpenMausBot adapter ✅</text>
    <rect x="470" y="172" width="220" height="34" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="580" y="193" fill="#3730a3">DeepSeek Harness adapter ✅</text>
    <text x="380" y="222" fill="#4b5563" font-size="11.5">adapters: backends · stores · event sinks — core logic is never duplicated</text>
    <line x1="300" y1="156" x2="240" y2="170" stroke="#a5b4fc" stroke-width="1.4"/>
    <line x1="460" y1="156" x2="520" y2="170" stroke="#a5b4fc" stroke-width="1.4"/>
  </g>

  <!-- computers -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="90" y="256" width="580" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="380" y="281" fill="#111827">GUI + CLI computers — remote SSH Linux boxes · cloud computers · local demo</text>
    <line x1="190" y1="206" x2="260" y2="254" stroke="#9ca3af" stroke-width="1.4"/>
    <line x1="580" y1="206" x2="500" y2="254" stroke="#9ca3af" stroke-width="1.4"/>
  </g>
</svg>
